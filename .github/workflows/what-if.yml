name: What-if Scenarios — Independent Film
run-name: '${{ inputs.video_title }}'
on:
  workflow_dispatch:
    inputs:
      video_title:
        description: 'Title for this niche only'
        type: string
        required: true
        default: "What If Every Lie Left a Mark on Your Face?"
      video_description:
        description: 'Independent creative brief for this film'
        type: string
        required: true
        default: "An original five-minute speculative animated moral drama. Noah wishes liars could be recognized immediately. In this fictional world an intentional lie draws a magenta crack on the speaker's cheek; admitting it erases it. He exposes a self-serving bully and enjoys the applause. Then he gives a child a cruel but technically true verdict and sees that a clean face can still hurt someone. At a hospital his mother lies that she is not frightened. His own denial of wanting applause marks his face. The resolution is an honest apology and choosing helpful, compassionate truth, rather than policing everyone else. Cool violet city, large faces, dynamic physical acting, ink spreading and clearing, public confrontation, a torn drawing, rain and an intimate hospital reconciliation. Sparse speech, cinematic action and expressive reactions. The premise and consequences are fiction, not psychology claims."
      minutes:
        description: 'Target duration in minutes; 5 requires a 4–6 minute result'
        type: string
        required: true
        default: '5'
      quality:
        description: 'Final production is 1080p60'
        type: choice
        default: production
        options: [production, preview, draft]
      reviewed_plan_path:
        description: 'Directed story plan. Clear only when writing a different story from new inputs'
        type: string
        required: false
        default: episodes/what-if.json
      source_notes_path:
        description: 'Optional reviewed factual source JSON for a newly written story'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: what-if-film-${{ github.ref }}
  cancel-in-progress: false
jobs:
  what_if:
    uses: ./.github/workflows/produce-film.yml
    with:
      title: ${{ inputs.video_title }}
      brief: ${{ inputs.video_description }}
      minutes: ${{ inputs.minutes }}
      niche: 'What-if & Survival'
      key: what-if
      quality: ${{ inputs.quality }}
      plan: ${{ inputs.reviewed_plan_path }}
      sources: ${{ inputs.source_notes_path }}
