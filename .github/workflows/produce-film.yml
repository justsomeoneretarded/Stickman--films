name: Independent Film Renderer (shared implementation)
on:
  workflow_call:
    inputs:
      title: {required: true, type: string}
      brief: {required: true, type: string}
      minutes: {required: true, type: string}
      niche: {required: true, type: string}
      key: {required: true, type: string}
      quality: {required: true, type: string}
      plan: {required: false, type: string, default: ''}
      sources: {required: false, type: string, default: ''}
permissions:
  contents: read
jobs:
  film:
    name: Write, animate and finish one independent film
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      FILM_TITLE: ${{ inputs.title }}
      FILM_BRIEF: ${{ inputs.brief }}
      FILM_MINUTES: ${{ inputs.minutes }}
      FILM_NICHE: ${{ inputs.niche }}
      FILM_QUALITY: ${{ inputs.quality }}
      FILM_PLAN: ${{ inputs.plan }}
      FILM_SOURCES: ${{ inputs.sources }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      RENDER_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libcairo2 fonts-dejavu-core
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - name: Validate title, brief, duration and selected story mode
        run: |
          python - <<'PY'
          import os
          from stickfilm.workflow import validate_inputs, failure_report
          try:
              validate_inputs(os.environ)
          except BaseException as error:
              failure_report('output/film', error)
              raise
          PY
      - name: Verify animation engine
        run: pytest -q
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: models
          key: independent-models-${{ runner.os }}-${{ hashFiles('config/models.json') }}-${{ inputs.plan == '' && 'writer' || 'voice' }}
      - name: Download verified local voice
        if: inputs.plan != ''
        run: timeout 600 stickfilm models
      - name: Install free local writer for a new title and brief
        if: inputs.plan == ''
        run: |
          pip install -r requirements-writer.lock --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          timeout 900 stickfilm models --local
      - name: Produce this film only
        run: timeout 3300 python scripts/independent_produce.py
      - name: Upload this film and its own production documents
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.key }}-film-1080p60
          retention-days: 30
          if-no-files-found: warn
          path: |
            output/film/*.mp4
            output/film/*.json
            output/film/*.md
            output/film/*.jpg
            output/film/*.log
      - name: Preserve failure details
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.key }}-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/film/failure.json
            output/film/failure.md
            output/film/writer-*.json
            output/film/voice/*.json
            output/film/scenes/*.log
      - if: success()
        run: cat output/film/quality-report.md >> "$GITHUB_STEP_SUMMARY"
