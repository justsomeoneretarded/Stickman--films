name: Psychology — Independent Film
run-name: '${{ inputs.video_title }}'
on:
  workflow_dispatch:
    inputs:
      video_title:
        description: 'Title for this niche only'
        type: string
        required: true
        default: "Your Brain Isn't Lazy\u2014Your Goals Might Be the Problem"
      video_description:
        description: 'Independent creative brief for this film'
        type: string
        required: true
        default: "An original, research-informed five-minute story about Milo, who mistakes borrowed ambitions for personal failure. Ada helps him question a wall of impossible goals, choose one meaningful project and build a specific first step. Warm, tactile 2.5D visual metaphors: a goal wall, a backpack of expectations, a rope tied to a mountain, notifications, a tiny staircase and a forgiving progress calendar. Empathetic, provocative, never diagnostic; distinguish poor goal fit from time, health and material constraints. End with one imperfect page, not a miraculous life transformation."
      minutes:
        description: 'Target duration in minutes; 5 requires a 4–6 minute result'
        type: string
        required: true
        default: '5'
      quality:
        description: 'Final production is 1080p60'
        type: choice
        default: production
        options: [production, preview, draft]
      reviewed_plan_path:
        description: 'Optional reviewed story JSON; blank writes a new story from your inputs'
        type: string
        required: false
      source_notes_path:
        description: 'Optional reviewed factual source JSON for a newly written story'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: psychology-film-${{ github.ref }}
  cancel-in-progress: false
jobs:
  psychology:
    uses: ./.github/workflows/produce-film.yml
    with:
      title: ${{ inputs.video_title }}
      brief: ${{ inputs.video_description }}
      minutes: ${{ inputs.minutes }}
      niche: 'Psychology & Human Behavior'
      key: psychology
      quality: ${{ inputs.quality }}
      plan: ${{ inputs.reviewed_plan_path }}
      sources: ${{ inputs.source_notes_path }}
