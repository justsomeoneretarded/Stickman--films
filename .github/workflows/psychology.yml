name: Psychology — Independent Film
run-name: '${{ inputs.video_title }}'
on:
  workflow_dispatch:
    inputs:
      video_title:
        description: 'Title for this niche only'
        type: string
        required: true
        default: "They Loved Him More When He Was Useful"
      video_description:
        description: 'Independent creative brief for this film'
        type: string
        required: true
        default: "A five-minute original fictional animated drama about Eli, a compulsive people-pleaser, and June, his daughter. A reserved seat at her school performance becomes the emotional anchor. Colleagues praise Eli while piling favors into his arms; each yes becomes a visible red thread. He misses June's performance while earning applause for a boss who takes his work. At home, a child's drawing shows the empty chair. The climax is a costly refusal, followed by repairing June's cardboard stage together. Sparse dialogue, original large expressive rigs, warm layered rooms, physical object exchanges and major staging changes in every shot. The psychology is dramatized as fiction, never a diagnosis. No reuse of the earlier goal-wall explainer."
      minutes:
        description: 'Target duration in minutes; 5 requires a 4–6 minute result'
        type: string
        required: true
        default: '5'
      quality:
        description: 'Final production is 1080p60'
        type: choice
        default: production
        options: [production, preview, draft]
      reviewed_plan_path:
        description: 'Directed story plan. Clear only when writing a different story from new inputs'
        type: string
        required: false
        default: episodes/psychology.json
      source_notes_path:
        description: 'Optional reviewed factual source JSON for a newly written story'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: psychology-film-${{ github.ref }}
  cancel-in-progress: false
jobs:
  psychology:
    uses: ./.github/workflows/produce-film.yml
    with:
      title: ${{ inputs.video_title }}
      brief: ${{ inputs.video_description }}
      minutes: ${{ inputs.minutes }}
      niche: 'Psychology & Human Behavior'
      key: psychology
      quality: ${{ inputs.quality }}
      plan: ${{ inputs.reviewed_plan_path }}
      sources: ${{ inputs.source_notes_path }}
