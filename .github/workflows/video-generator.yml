name: Cinematic Stickman Video Generator
run-name: '${{ inputs.production_mode }} · ${{ inputs.video_title }}'
on:
  workflow_dispatch:
    inputs:
      video_title:
        description: 'Video title (single-video mode)'
        type: string
        required: true
      video_description:
        description: 'Creative brief, tone, story and actions (single-video mode)'
        type: string
        required: true
      minutes:
        description: 'Desired minutes; decimals accepted, default safe max 10'
        type: string
        required: true
        default: '3'
      niche:
        description: 'Niche; source notes required for grounded factual generation'
        type: choice
        default: Auto-detect
        options:
          - Auto-detect
          - Psychology & Human Behavior
          - Relatable Comedy
          - Money & Business
          - History & Geopolitics
          - What-if & Survival
          - Storytelling & Life Lessons
          - Science Explained
          - Self-improvement
          - Technology & Cybersecurity
          - Mysteries & Scams
      production_mode:
        description: 'Comparison uses ten distinct authored 75s examples'
        type: choice
        default: Single Video
        options:
          - Single Video
          - Ten-Niche Comparison
          - Animation Quality Test
      quality:
        description: 'production = 1080p60; preview = 720p24; draft = 360p24'
        type: choice
        default: production
        options: [production, preview, draft]
      plan_path:
        description: 'Optional reviewed JSON in this repo; title/brief must match'
        type: string
        required: false
      source_notes_path:
        description: 'Optional JSON source notes in this repo; otherwise clearly fictional'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: cinematic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  MAX_MINUTES: ${{ vars.MAX_MINUTES || '10' }}
  MAX_PARALLEL: ${{ vars.MAX_PARALLEL || '2' }}
  COMPARISON_MINUTES: ${{ vars.COMPARISON_MINUTES || '1.25' }}
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  RENDER_THREADS: '2'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      parallel: ${{ steps.inputs.outputs.parallel }}
      mode: ${{ steps.inputs.outputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pydantic==2.12.3
      - id: inputs
        env:
          PYTHONPATH: src
        run: python scripts/actions_inputs.py
  benchmark:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libcairo2 fonts-dejavu-core
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - name: Qualify continuous movement at 1080p60
        run: timeout 600 stickfilm benchmark --out output/benchmark
      - name: Upload benchmark and measured report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: animation-benchmark-1080p60
          retention-days: 14
          if-no-files-found: error
          path: |
            output/benchmark/*.mp4
            output/benchmark/*.json
            output/benchmark/*.md
            output/benchmark/*.jpg
            output/benchmark/*.log
      - if: success()
        run: cat output/benchmark/quality-report.md >> "$GITHUB_STEP_SUMMARY"
  render:
    needs: [validate, benchmark]
    if: needs.validate.outputs.mode != 'Animation Quality Test'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.validate.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      JOB_KEY: ${{ matrix.key }}
      PLAN_PATH: ${{ matrix.plan }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libcairo2 fonts-dejavu-core
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: models
          key: free-models-${{ runner.os }}-${{ hashFiles('config/models.json') }}-${{ matrix.plan == '' && 'writer' || 'voice' }}
      - name: Download and verify local voice models
        if: matrix.plan != ''
        run: timeout 600 stickfilm models
      - name: Install and verify free local writer
        if: matrix.plan == ''
        run: |
          pip install -r requirements-writer.lock --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          timeout 900 stickfilm models --local
      - name: Generate, render, mix and validate
        run: timeout 2400 python scripts/actions_produce.py
      - name: Upload video, contact sheet and quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinematic-${{ matrix.key }}
          retention-days: 14
          if-no-files-found: error
          path: |
            output/${{ matrix.key }}/*.mp4
            output/${{ matrix.key }}/*.json
            output/${{ matrix.key }}/*.md
            output/${{ matrix.key }}/*.jpg
            output/${{ matrix.key }}/*.log
      - name: Upload intermediate diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ matrix.key }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/${{ matrix.key }}/voice/*.json
            output/${{ matrix.key }}/scenes/*.log
            output/${{ matrix.key }}/scenes/*.cache.json
      - if: success()
        run: cat "output/$JOB_KEY/quality-report.md" >> "$GITHUB_STEP_SUMMARY"
  comparison:
    needs: [validate, benchmark, render]
    if: always() && needs.validate.outputs.mode == 'Ten-Niche Comparison'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: cinematic-*
          path: work/comparison
      - run: pip install pydantic==2.12.3
      - env:
          PYTHONPATH: src
        run: python -c "from stickfilm.comparison import compare; compare('work/comparison', 'output/comparison.md')"
      - run: cat output/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ten-niche-comparison-report
          retention-days: 14
          path: output/comparison.md
